# =============================================================================
# Nemawashi Enterprise Governance Engine - Docker Compose Orchestration
# =============================================================================

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemawashi-governance-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - NEMAWASHI_AUDIT_LOG_DIR=/app/audit_logs
      - NEMAWASHI_CACHE_DIR=/app/cache
      - NEMAWASHI_STATE_DIR=/app/storage/suspended_states
      - NEMAWASHI_WEBHOOK_SECRET=${NEMAWASHI_WEBHOOK_SECRET:-change-me-in-production-32-byte-secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEMAWASHI_MAX_ROUNDS=${NEMAWASHI_MAX_ROUNDS:-3}
    volumes:
      - ./audit_logs:/app/audit_logs
      - ./cache:/app/cache
      - ./storage/suspended_states:/app/storage/suspended_states

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemawashi-governance-test
    profiles:
      - test
    environment:
      - NEMAWASHI_WEBHOOK_SECRET=test-secret-key-32-bytes-long!
      - NEMAWASHI_AUDIT_LOG_DIR=/tmp/audit_logs
      - NEMAWASHI_CACHE_DIR=/tmp/cache
      - NEMAWASHI_STATE_DIR=/tmp/storage
      - PYTHONPATH=/app/src
    command: ["pytest", "tests", "-v"]

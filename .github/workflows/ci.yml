name: Continuous Integration & Container Parity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Unit & Integration Tests (Python 3.12 + uv)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      GEMINI_API_KEY: ""
      NEMAWASHI_WEBHOOK_SECRET: "ci-test-secret-32-bytes-minimum"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Create virtual environment & install dependencies
        run: |
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -r requirements.txt
          uv pip install -e .

      - name: Verify package import resolution
        run: |
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "import nemawashi; print('Successfully imported nemawashi from:', nemawashi.__file__)"

      - name: Run complete test suite (66 tests in deterministic offline mode)
        run: |
          pytest tests -v

  docker-build-verify:
    name: Container Build & Linux Parity Verification
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container image
        run: |
          docker build -t nemawashi-governance-engine:ci .

      - name: Run containerized test suite inside production image
        run: |
          docker run --rm -e NEMAWASHI_WEBHOOK_SECRET="ci-test-secret" nemawashi-governance-engine:ci pytest -v
